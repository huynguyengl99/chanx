<!DOCTYPE html>
<html>
<head>
    <title>{{ title }}</title>
    <link rel="stylesheet" href="{{ css_url }}"{% if css_integrity %} integrity="{{ css_integrity }}" crossorigin="anonymous"{% endif %}>
</head>
<body>
    {% if error %}
        <div style="padding: 2rem; background: #fee; border: 1px solid #fcc; margin: 2rem; border-radius: 8px; color: #c33;">
            <h3>Error</h3>
            <p>{{ error }}</p>
        </div>
    {% else %}
        <div id="asyncapi"></div>

        <script src="{{ js_url }}"{% if js_integrity %} integrity="{{ js_integrity }}" crossorigin="anonymous"{% endif %}></script>
        <script>
            AsyncApiStandalone.render({
                schema: {{ schema_json|safe }},
                config: {
                    show: {
                        sidebar: true,
                    }
                },
            }, document.getElementById('asyncapi'));
        </script>
    {% endif %}
</body>
</html>
